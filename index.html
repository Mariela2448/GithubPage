<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar Color de Fondo</title>
</head>
<body>

<script>

var color;

color = prompt(
    "Escoge un color:\n1. Negro\n2. Azul\n3. Rojo\n4. Verde\n5. Amarillo\n6. Morado",
    ""
);

if (color == "1") {
    document.bgColor = "#000000";
}
else if (color == "2") {
    document.bgColor = "#0000FF";
}
else if (color == "3") {
    document.bgColor = "#FF0000";
}
else if (color == "4") {
    document.bgColor = "#00FF00";
}
else if (color == "5") {
    document.bgColor = "#FFFF00";
}
else if (color == "6") {
    document.bgColor = "#800080";
}
else {
    document.write("Opción no válida");
}

</script>

</body>
</html>
